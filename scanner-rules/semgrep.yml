rules:
  - id: zanjir.python.shell-execution
    languages: [python]
    severity: WARNING
    message: Shell orqali buyruq bajarilishi; kiruvchi qiymat manbasini tekshiring.
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
  - id: zanjir.python.eval
    languages: [python]
    severity: WARNING
    message: Dinamik kod bajarilishi; foydalanuvchi qiymati yetib kelishini tekshiring.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
  - id: zanjir.python.tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: HTTPS sertifikatini tekshirish ochirilgan.
    pattern: requests.$METHOD(..., verify=False, ...)
  - id: zanjir.javascript.eval
    languages: [javascript, typescript]
    severity: WARNING
    message: Dinamik kod bajarilishi; foydalanuvchi qiymati yetib kelishini tekshiring.
    pattern: eval(...)
  - id: zanjir.javascript.shell-execution
    languages: [javascript, typescript]
    severity: WARNING
    message: Shell orqali buyruq bajarilishi; kiruvchi qiymat manbasini tekshiring.
    pattern: child_process.exec(...)
  - id: zanjir.go.tls-verification-disabled
    languages: [go]
    severity: WARNING
    message: TLS sertifikatini tekshirish ochirilgan.
    pattern: 'tls.Config{..., InsecureSkipVerify: true, ...}'
  - id: zanjir.java.process-execution
    languages: [java]
    severity: WARNING
    message: Tashqi buyruq bajarilishi; kiruvchi qiymat manbasini tekshiring.
    pattern: Runtime.getRuntime().exec(...)
  # --- 0.7.1: kiruvchi qiymatdan xavfli amalgacha kuzatiladigan (taint) qoidalar.
  # ERROR faqat manba (HTTP so'rovi) va xavfli amal bitta oqimda ko'ringanda
  # beriladi: CI gate aynan ERROR ni sanaydi, shuning uchun taxmin bu yerga kirmaydi.
  - id: zanjir.python.command-injection
    languages: [python]
    severity: ERROR
    message: HTTP so'rovidagi qiymat shell buyrug'iga yetib boradi (buyruq injeksiyasi).
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.$ATTR
          - pattern: $REQ.GET
          - pattern: $REQ.POST
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
  - id: zanjir.python.sql-injection
    languages: [python]
    severity: ERROR
    message: HTTP so'rovidagi qiymat SQL matniga qo'shilib bajariladi (SQL injeksiyasi). Parametrli so'rov ishlating.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.$ATTR
          - pattern: $REQ.GET
          - pattern: $REQ.POST
    pattern-sinks:
      - patterns:
          - pattern-inside: $DB.$EXEC($QUERY, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(execute|executemany|executescript|raw|extra)$
          - focus-metavariable: $QUERY
  - id: zanjir.python.sql-string-building
    languages: [python]
    severity: WARNING
    message: SQL matni satr birlashtirish yoki formatlash bilan qurilgan; parametrli so'rov ishlating.
    pattern-either:
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute("..." + $X + $Y, ...)
      - pattern: $DB.execute("..." % $X, ...)
      - pattern: $DB.execute("...".format(...), ...)
      - pattern: $DB.execute(f"...", ...)
  - id: zanjir.python.insecure-deserialization
    languages: [python]
    severity: ERROR
    message: HTTP so'rovidagi ma'lumot pickle/marshal bilan ochiladi -- bu ixtiyoriy kod bajarilishiga olib keladi.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.$ATTR
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: cPickle.loads(...)
          - pattern: marshal.loads(...)
          - pattern: dill.loads(...)
  - id: zanjir.python.pickle-usage
    languages: [python]
    severity: WARNING
    message: pickle ishonchsiz ma'lumotni ochsa ixtiyoriy kod bajariladi; manbani tekshiring.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
  - id: zanjir.python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: yaml.load xavfsiz Loader'siz chaqirilgan -- YAML orqali ixtiyoriy Python obyekti yaratiladi. yaml.safe_load ishlating.
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load($DATA)
      - pattern: yaml.load(..., Loader=yaml.Loader, ...)
      - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)
      - pattern: yaml.load(..., Loader=yaml.FullLoader, ...)
  - id: zanjir.python.flask-debug
    languages: [python]
    severity: WARNING
    message: Flask debug rejimi yoqilgan -- Werkzeug konsoli orqali kod bajarish mumkin bo'ladi.
    pattern: $APP.run(..., debug=True, ...)
  - id: zanjir.python.weak-hash
    languages: [python]
    severity: WARNING
    message: MD5/SHA1 xavfsizlik uchun yaroqsiz (parol, imzo, token). Parol uchun bcrypt/argon2, qolganiga SHA-256 ishlating.
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)
  - id: zanjir.javascript.command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP so'rovidagi qiymat shell buyrug'iga yetib boradi (buyruq injeksiyasi).
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD
  - id: zanjir.javascript.sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP so'rovidagi qiymat SQL matniga qo'shilib bajariladi (SQL injeksiyasi). Parametrli so'rov ishlating.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sinks:
      - patterns:
          - pattern-inside: $DB.$Q($SQL, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(query|execute|raw)$
          - focus-metavariable: $SQL
  - id: zanjir.java.sql-string-building
    languages: [java]
    severity: WARNING
    message: SQL matni satr birlashtirish bilan qurilgan; PreparedStatement parametrlarini ishlating.
    pattern-either:
      - pattern: $S.executeQuery("..." + $X)
      - pattern: $S.executeQuery("..." + $X + $Y)
      - pattern: $S.executeUpdate("..." + $X)
      - pattern: $S.executeUpdate("..." + $X + $Y)
      - pattern: $S.execute("..." + $X)
      - pattern: $S.execute("..." + $X + $Y)
      - pattern: $C.prepareStatement("..." + $X)
      - pattern: $C.prepareStatement("..." + $X + $Y)
  - id: zanjir.go.sql-string-building
    languages: [go]
    severity: WARNING
    message: SQL matni fmt.Sprintf bilan qurilgan; ? / $1 parametrlarini ishlating.
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf(...), ...)
      - pattern: $DB.Exec(fmt.Sprintf(...), ...)
  # --- 2026-09-25 benchmark: tillar bo'yicha taint qoidalari (Java, Go, PHP) va
  # rasmiy paketda ham topilmagan holatlar (lxml XXE, PHP mysqli SQLi, prototype pollution).
  - id: zanjir.java.command-injection
    languages: [java]
    severity: ERROR
    message: HTTP so'rov parametri tashqi buyruqqa yetib boradi (buyruq injeksiyasi).
    mode: taint
    pattern-sources:
      - pattern: (javax.servlet.http.HttpServletRequest $R).getParameter(...)
      - pattern: (HttpServletRequest $R).getParameter(...)
    pattern-sinks:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...)
  - id: zanjir.java.sql-injection
    languages: [java]
    severity: ERROR
    message: HTTP so'rov parametri SQL matniga qo'shilib bajariladi (SQL injeksiyasi). PreparedStatement parametrlarini ishlating.
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $R).getParameter(...)
    pattern-sinks:
      - patterns:
          - pattern-inside: $S.$EXEC($Q, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(executeQuery|executeUpdate|execute|prepareStatement|addBatch)$
          - focus-metavariable: $Q
  - id: zanjir.java.insecure-deserialization
    languages: [java]
    severity: ERROR
    message: HTTP so'rov tanasi ObjectInputStream bilan ochiladi -- ixtiyoriy kod bajarilishiga olib keladi.
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $R).getInputStream()
    pattern-sinks:
      - pattern: new ObjectInputStream(...)
  - id: zanjir.go.sql-injection
    languages: [go]
    severity: ERROR
    message: HTTP so'rov qiymati SQL matniga qo'shilib bajariladi (SQL injeksiyasi). ? / $1 parametrlarini ishlating.
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-inside: $DB.$Q($SQL, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(Query|QueryRow|Exec|QueryContext|ExecContext)$
          - focus-metavariable: $SQL
  - id: zanjir.go.command-injection
    languages: [go]
    severity: ERROR
    message: HTTP so'rov qiymati tashqi buyruqqa yetib boradi (buyruq injeksiyasi).
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
    pattern-sinks:
      - pattern: exec.Command(...)
      - pattern: exec.CommandContext(...)
  - id: zanjir.php.sql-injection
    languages: [php]
    severity: ERROR
    message: Foydalanuvchi qiymati ($_GET/$_POST/$_REQUEST) SQL matniga qo'shilib bajariladi. Tayyorlangan so'rov (prepare/bind) ishlating.
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
    pattern-sanitizers:
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: mysqli_real_escape_string(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($C, $Q, ...)
              - pattern: mysql_query($Q, ...)
              - pattern: pg_query($C, $Q)
              - pattern: $DB->query($Q, ...)
              - pattern: $DB->exec($Q)
          - focus-metavariable: $Q
  - id: zanjir.php.xss
    languages: [php]
    severity: ERROR
    message: Foydalanuvchi qiymati HTML'ga ekranlanmasdan chiqariladi (XSS). htmlspecialchars() ishlating.
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: intval(...)
    pattern-sinks:
      - pattern: echo ...;
      - pattern: print(...)
  - id: zanjir.python.xxe
    languages: [python]
    severity: ERROR
    message: XML parser tashqi entity'larni ochadi (XXE) -- fayl o'qish yoki SSRF. resolve_entities=False yoki defusedxml ishlating.
    pattern-either:
      - pattern: etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: lxml.etree.XMLParser(..., resolve_entities=True, ...)
      - pattern: xml.sax.make_parser().setFeature(xml.sax.handler.feature_external_ges, True)
  - id: zanjir.javascript.prototype-pollution
    languages: [javascript, typescript]
    severity: WARNING
    message: Obyekt kalitlari tekshiruvsiz nusxalanadi -- __proto__ orqali prototype pollution. Kalitni tekshiring yoki Object.create(null) ishlating.
    patterns:
      - pattern: |
          for (const $K in $SRC) { ... $T[$K] = $SRC[$K]; ... }
      - pattern-not: |
          for (const $K in $SRC) { ... if (<... $K ...>) { ... } ... }
  - id: zanjir.python.template-injection
    languages: [python]
    severity: ERROR
    message: HTTP so'rovidagi qiymat shablon matnining o'ziga qo'shiladi (SSTI) -- server tomonida kod bajarilishi mumkin. Qiymatni shablonga o'zgaruvchi sifatida bering.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.$ATTR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: render_template_string($T, ...)
              - pattern: flask.render_template_string($T, ...)
              - pattern: jinja2.Template($T, ...)
              - pattern: Template($T, ...)
          - focus-metavariable: $T
