id: zanjir-sql-backup
info:
  name: Ochiq SQL zaxira fayli
  author: zanjir
  severity: high
http:
  - method: GET
    path:
      - "{{BaseURL}}/backup.sql"
      - "{{BaseURL}}/dump.sql"
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 206]
      # v1 demanded a mysqldump/pg_dump banner as well, so a hand-made or
      # SQLite/phpMyAdmin export was missed. A statement that defines or fills a
      # table, at the start of a line, in a non-HTML body is the dump itself.
      - type: regex
        part: body
        regex:
          - '(?mi)^\s*(CREATE TABLE|INSERT INTO|DROP TABLE|COPY [a-z_."]+ \()'
      - type: word
        part: body
        words: ['<html', '<body']
        negative: true

