id: zanjir-env
info:
  name: Ochiq muhit konfiguratsiyasi (.env)
  author: zanjir
  severity: high
http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.production"
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 206]
      # A secret-bearing key with a value. v1 also demanded a second, well-known
      # non-secret key (APP_ENV, DB_HOST, ...) and so missed a .env that held
      # only secrets -- exactly the worst case.
      - type: regex
        part: body
        regex:
          - '(?m)^(export\s+)?[A-Z0-9_]*(PASSWORD|PASSWD|SECRET|TOKEN|API_KEY|APIKEY|PRIVATE_KEY|ACCESS_KEY|APP_KEY|DATABASE_URL|DSN)[A-Z0-9_]*\s*=\s*\S+'
      # ...inside something shaped like a dotenv file: two consecutive KEY=value
      # lines, which a prose page or an error page does not produce.
      - type: regex
        part: body
        regex:
          - '(?m)^(export\s+)?[A-Z][A-Z0-9_]*\s*=[^\n]*\n(export\s+)?[A-Z][A-Z0-9_]*\s*='
      - type: word
        part: body
        words: ['<html', '<body']
        negative: true

